<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Taste of Bhaarat</title>
    <meta name="description" content="Explore premium Indian spices and hand-pounded masalas at Taste of Bhaarat in Asansol, West Bengal. Shop authentic spices, haldi, elichi, lal mirch, and more online.">
    <meta name="keywords" content="shop masalas in Asansol, spice store in Asansol, masala distributors in Asansol, Asansol me masala distributers, haldi, elichi, lal mirch, kali mirch, Indian spices, Taste of Bhaarat">
    <meta name="author" content="Taste of Bhaarat">
    <link rel="canonical" href="https://tasteofbhaarat.onrender.com/shop/">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="theme-color" content="#7c2d12">
    <link rel="icon" type="image/png" href="/image.png">
    <link rel="shortcut icon" type="image/png" href="/image.png">
    <link rel="apple-touch-icon" href="/image.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Taste of Bhaarat">
    <meta property="og:title" content="Shop Masalas in Asansol | Taste of Bhaarat">
    <meta property="og:description" content="Browse premium Indian spices and masalas from Taste of Bhaarat in Asansol, West Bengal.">
    <meta property="og:url" content="https://tasteofbhaarat.onrender.com/shop/">
    <meta property="og:image" content="https://tasteofbhaarat.onrender.com/cardamom_.jpg">
    <meta property="og:locale" content="en_IN">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Shop Masalas in Asansol | Taste of Bhaarat">
    <meta name="twitter:description" content="Premium Indian spices and hand-pounded masalas from Asansol, West Bengal.">
    <meta name="twitter:image" content="https://tasteofbhaarat.onrender.com/cardamom_.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        spice: {
                            50: '#fff7ed',
                            500: '#f97316',
                            700: '#c2410c',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
    <script src="/js/navbar.js" defer></script>
    <script src="/js/cart.js" defer></script>
    <script src="/js/include.js" defer></script>

    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(249, 115, 22, 0.12), transparent 22%),
                repeating-linear-gradient(
                    115deg,
                    rgba(194, 65, 12, 0.035) 0,
                    rgba(194, 65, 12, 0.035) 2px,
                    transparent 2px,
                    transparent 68px
                ),
                #fdfbf7;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 18rem;
            height: 18rem;
            border-radius: 9999px;
            pointer-events: none;
            background:
                radial-gradient(circle, rgba(249, 115, 22, 0.82) 0%, rgba(251, 146, 60, 0.44) 34%, rgba(251, 146, 60, 0.12) 58%, transparent 74%);
            filter: blur(28px);
            opacity: 0.95;
            z-index: 0;
            transform: translate3d(-45%, -45%, 0);
            will-change: transform;
        }

        .glass-nav {
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .product-card {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(124, 45, 18, 0.12);
        }

        .product-image-container img {
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.08);
        }

        .gsap-reveal {
            opacity: 0;
            visibility: hidden;
        }

        .category-tab.active {
            background-color: #7c2d12;
            color: #ffffff;
            border-color: #7c2d12;
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor-glow {
                display: none;
            }
        }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased">
    
    <div class="cursor-glow hidden md:block" data-cursor-glow aria-hidden="true"></div>

    <div data-include-header></div>

    <header class="pt-32 pb-12 relative z-10">
        <div class="container mx-auto px-8 text-center space-y-4">
            <h1 class="gsap-reveal text-5xl md:text-6xl font-serif font-bold text-spice-900">Our Complete Collection</h1>
            <p class="gsap-reveal text-gray-600 max-w-2xl mx-auto text-lg">Browse our full range of 100% natural, hand-pounded masalas. Sourced directly from farms and hand-crafted with care.</p>
        </div>
    </header>

    <main class="flex-grow pb-24 relative z-10">
        <div class="container mx-auto px-8">
            
            <!-- SEARCH & FILTER BAR -->
            <div class="bg-white/70 backdrop-blur-md rounded-3xl p-6 mb-12 border border-spice-900/10 shadow-lg space-y-6">
                <div class="grid md:grid-cols-12 gap-4 items-center">
                    
                    <!-- Search Input -->
                    <div class="md:col-span-7 relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input
                            type="text"
                            id="shopSearchInput"
                            placeholder="Search by spice name, usage (e.g. Chai, Curries)..."
                            class="w-full bg-white pl-11 pr-4 py-3.5 rounded-2xl border border-spice-900/15 text-sm text-spice-900 placeholder-gray-400 focus:outline-none focus:border-spice-500 focus:ring-4 focus:ring-spice-500/10 transition-all"
                        >
                    </div>

                    <!-- Sort Select -->
                    <div class="md:col-span-5 flex items-center justify-end gap-3">
                        <label for="shopSortSelect" class="text-xs font-bold uppercase tracking-wider text-spice-900 shrink-0">Sort By:</label>
                        <select
                            id="shopSortSelect"
                            class="w-full md:w-auto bg-white px-4 py-3.5 rounded-2xl border border-spice-900/15 text-sm text-spice-900 focus:outline-none focus:border-spice-500 transition-all appearance-none cursor-pointer"
                        >
                            <option value="featured">Featured</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="name-asc">Name: A to Z</option>
                        </select>
                    </div>
                </div>

                <!-- Category Tabs -->
                <div class="flex flex-wrap items-center justify-between gap-3 border-t border-spice-900/5 pt-4">
                    <div class="flex flex-wrap gap-2" id="categoryTabs">
                        <button type="button" class="category-tab active px-5 py-2 rounded-full text-xs font-bold border border-spice-900/15 text-gray-700 hover:border-spice-900 transition-all cursor-pointer" data-category="all">
                            All Spices
                        </button>
                        <button type="button" class="category-tab px-5 py-2 rounded-full text-xs font-bold border border-spice-900/15 text-gray-700 hover:border-spice-900 transition-all cursor-pointer" data-category="ground-masalas">
                            Ground Masalas
                        </button>
                        <button type="button" class="category-tab px-5 py-2 rounded-full text-xs font-bold border border-spice-900/15 text-gray-700 hover:border-spice-900 transition-all cursor-pointer" data-category="whole-spices">
                            Whole Spices
                        </button>
                        <button type="button" class="category-tab px-5 py-2 rounded-full text-xs font-bold border border-spice-900/15 text-gray-700 hover:border-spice-900 transition-all cursor-pointer" data-category="signature-blends">
                            Signature Blends
                        </button>
                    </div>

                    <div id="resultsCounter" class="text-xs font-semibold text-gray-500">
                        Loading products...
                    </div>
                </div>
            </div>

            <!-- SHOP GRID -->
            <div id="shop-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Products injected dynamically -->
            </div>

            <!-- ZERO RESULTS STATE -->
            <div id="zeroResults" class="hidden text-center py-20 bg-white/50 rounded-3xl border border-spice-900/5 p-8">
                <div class="w-16 h-16 bg-spice-50 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">🔍</div>
                <h3 class="text-2xl font-serif font-bold text-spice-900 mb-2">No Spices Found</h3>
                <p class="text-gray-600 text-sm max-w-sm mx-auto mb-6">We couldn't find any spices matching your current search or category filter.</p>
                <button type="button" id="resetFiltersBtn" class="bg-spice-900 text-white px-6 py-2.5 rounded-full text-xs font-bold tracking-wider uppercase hover:bg-spice-700 transition-colors">
                    Reset Filters
                </button>
            </div>

        </div>
    </main>

    <div data-include-footer></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        let allSpices = [];
        let activeCategory = "all";
        let searchQuery = "";
        let currentSort = "featured";

        function getPriceForWeight(spice, weight) {
            if (spice.pricePerWeight && spice.pricePerWeight[weight]) {
                return spice.pricePerWeight[weight];
            }
            return spice.price || 250;
        }

        async function loadShopData() {
            try {
                const response = await fetch("../spices.json");
                if (!response.ok) throw new Error("Failed to load spices");
                const rawSpices = await response.json();
                
                allSpices = rawSpices.map((spice) => ({
                    ...spice,
                    image: new URL(spice.image, response.url).href
                }));

                renderShop();
                initPageAnimations();
            } catch (err) {
                console.error("Shop load error:", err);
                document.getElementById("shop-grid").innerHTML = `
                    <p class="col-span-full text-center text-red-500 py-10">Unable to load spices catalog. Please check spices.json.</p>
                `;
            }
        }

        function filterAndSortSpices() {
            return allSpices
                .filter((spice) => {
                    const matchCategory = activeCategory === "all" || spice.category === activeCategory;
                    
                    const q = searchQuery.toLowerCase().trim();
                    const matchSearch = !q || 
                        spice.name.toLowerCase().includes(q) ||
                        spice.description.toLowerCase().includes(q) ||
                        (spice.usage && spice.usage.some(u => u.toLowerCase().includes(q))) ||
                        (spice.features && spice.features.some(f => f.toLowerCase().includes(q)));

                    return matchCategory && matchSearch;
                })
                .sort((a, b) => {
                    if (currentSort === "price-asc") return a.price - b.price;
                    if (currentSort === "price-desc") return b.price - a.price;
                    if (currentSort === "name-asc") return a.name.localeCompare(b.name);
                    return 0; // featured default
                });
        }

        function renderShop() {
            const grid = document.getElementById("shop-grid");
            const zeroResults = document.getElementById("zeroResults");
            const counter = document.getElementById("resultsCounter");

            const filtered = filterAndSortSpices();

            counter.innerText = `Showing ${filtered.length} of ${allSpices.length} spices`;

            if (filtered.length === 0) {
                grid.innerHTML = "";
                zeroResults.classList.remove("hidden");
                return;
            }

            zeroResults.classList.add("hidden");

            grid.innerHTML = filtered.map((spice) => {
                const defaultWeight = spice.weight || (spice.weightOptions ? spice.weightOptions[0] : "100g");
                const initialPrice = getPriceForWeight(spice, defaultWeight);
                const weightOptions = spice.weightOptions || [defaultWeight];

                return `
                    <article class="gsap-card product-card bg-white/70 backdrop-blur-sm rounded-3xl overflow-hidden flex flex-col h-full border border-spice-900/5 shadow-sm hover:shadow-xl transition-all" data-slug="${spice.slug}">
                        <div class="product-image-container relative h-60 overflow-hidden shrink-0 bg-spice-50">
                            <a href="/product/?slug=${encodeURIComponent(spice.slug)}" class="block w-full h-full">
                                <img src="${spice.image}" alt="${spice.alt || spice.name}" class="w-full h-full object-cover">
                            </a>
                            ${spice.badge ? `<div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-spice-700 uppercase tracking-wide border border-spice-900/5">${spice.badge}</div>` : ""}
                        </div>

                        <div class="p-6 flex flex-col flex-grow">
                            <div class="mb-2">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-spice-500 bg-spice-50 px-2.5 py-1 rounded-md inline-block mb-1">
                                    ${spice.category ? spice.category.replace("-", " ") : "Spice"}
                                </span>
                                <h3 class="text-2xl font-serif font-bold text-spice-900 hover:text-spice-700 transition-colors">
                                    <a href="/product/?slug=${encodeURIComponent(spice.slug)}">${spice.name}</a>
                                </h3>
                            </div>

                            <p class="text-gray-600 text-xs leading-relaxed mb-4 flex-grow">${spice.shortDescription || spice.description}</p>

                            <!-- Weight Selector & Dynamic Price -->
                            <div class="bg-spice-50/60 p-3 rounded-2xl border border-spice-900/5 mb-4 space-y-2">
                                <div class="flex items-center justify-between text-xs">
                                    <label class="font-semibold text-gray-600">Select Size:</label>
                                    <select class="card-weight-select bg-white border border-spice-900/15 text-xs font-bold text-spice-900 rounded-lg px-2.5 py-1 focus:outline-none focus:border-spice-500 cursor-pointer">
                                        ${weightOptions.map(w => `<option value="${w}" ${w === defaultWeight ? 'selected' : ''}>${w}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="flex justify-between items-end border-t border-spice-900/5 pt-2">
                                    <span class="text-[11px] text-gray-500">Price</span>
                                    <span class="text-2xl font-serif font-bold text-spice-900">₹<span class="card-price-display">${initialPrice}</span></span>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="grid grid-cols-2 gap-2 mt-auto">
                                <button type="button" class="add-to-cart-btn bg-spice-900 text-white py-3 rounded-xl text-xs font-bold hover:bg-spice-700 transition-colors shadow-md flex items-center justify-center gap-1.5 cursor-pointer">
                                    <i class="fa-solid fa-basket-shopping text-xs"></i>
                                    <span>Add Basket</span>
                                </button>
                                <a href="/product/?slug=${encodeURIComponent(spice.slug)}" class="border border-spice-900/20 text-spice-900 py-3 rounded-xl text-xs font-bold hover:bg-spice-900 hover:text-white transition-colors text-center flex items-center justify-center">
                                    Details
                                </a>
                            </div>
                        </div>
                    </article>
                `;
            }).join("");

            // Bind weight select change events & Add to Cart
            document.querySelectorAll("#shop-grid article").forEach((card) => {
                const slug = card.dataset.slug;
                const spice = allSpices.find((s) => s.slug === slug);
                if (!spice) return;

                const weightSelect = card.querySelector(".card-weight-select");
                const priceDisplay = card.querySelector(".card-price-display");
                const addBtn = card.querySelector(".add-to-cart-btn");

                weightSelect.addEventListener("change", (e) => {
                    const selectedWeight = e.target.value;
                    const price = getPriceForWeight(spice, selectedWeight);
                    priceDisplay.innerText = price;
                });

                addBtn.addEventListener("click", () => {
                    const selectedWeight = weightSelect.value;
                    const price = getPriceForWeight(spice, selectedWeight);
                    if (window.TOBCart) {
                        window.TOBCart.addItem({
                            slug: spice.slug,
                            name: spice.name,
                            weight: selectedWeight,
                            price: price,
                            quantity: 1,
                            image: spice.image
                        });
                    }
                });
            });

            if (window.gsap) {
                gsap.fromTo(
                    grid.children,
                    { y: 20, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.35, stagger: 0.04, ease: "power2.out" }
                );
            }
        }

        // DOM Listeners for Search & Filters
        document.addEventListener("DOMContentLoaded", () => {
            loadShopData();

            const searchInput = document.getElementById("shopSearchInput");
            const sortSelect = document.getElementById("shopSortSelect");
            const tabs = document.querySelectorAll("#categoryTabs button");
            const resetBtn = document.getElementById("resetFiltersBtn");

            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                renderShop();
            });

            sortSelect.addEventListener("change", (e) => {
                currentSort = e.target.value;
                renderShop();
            });

            tabs.forEach((tab) => {
                tab.addEventListener("click", () => {
                    tabs.forEach((t) => t.classList.remove("active"));
                    tab.classList.add("active");
                    activeCategory = tab.dataset.category;
                    renderShop();
                });
            });

            resetBtn.addEventListener("click", () => {
                searchQuery = "";
                searchInput.value = "";
                activeCategory = "all";
                currentSort = "featured";
                sortSelect.value = "featured";
                tabs.forEach((t) => t.classList.remove("active"));
                tabs[0].classList.add("active");
                renderShop();
            });
        });

        function initPageAnimations() {
            gsap.set(".gsap-reveal", { autoAlpha: 1 });
            gsap.fromTo(".gsap-reveal", 
                { y: 30, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.8, stagger: 0.15, ease: "power3.out" }
            );
        }

        const cursorGlow = document.querySelector("[data-cursor-glow]");
        if (cursorGlow && window.matchMedia("(pointer: fine)").matches) {
            gsap.set(cursorGlow, { x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const moveGlowX = gsap.quickTo(cursorGlow, "x", { duration: 0.45, ease: "power3.out" });
            const moveGlowY = gsap.quickTo(cursorGlow, "y", { duration: 0.45, ease: "power3.out" });
            window.addEventListener("pointermove", (e) => {
                moveGlowX(e.clientX - 144);
                moveGlowY(e.clientY - 144);
            });
        }
    </script>
</body>
</html>
